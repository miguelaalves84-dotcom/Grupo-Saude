name: V4 isolated Chromium regression
on:
  push:
    branches: [fix/v4-p0-security-hardening-session, fix/v4-p0-security-hardening-clinics-stock, fix/v4-p0-security-hardening-tables-catalog, fix/v4-p0-security-hardening-profile-audit, fix/v4-p0-security-hardening-consolidation]
  pull_request:
    branches: [fix/v4-p0-security-hardening-session, fix/v4-p0-security-hardening-clinics-stock, fix/v4-p0-security-hardening-tables-catalog, fix/v4-p0-security-hardening-profile-audit, fix/v4-p0-security-hardening-consolidation]
permissions:
  contents: read
concurrency:
  group: v4-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Existing automated tests and build without network or application credentials
        run: |
          docker pull node:24-bookworm-slim
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,exec,size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            node:24-bookworm-slim sh -ec '
              cp -R /source /tmp/project
              cd /tmp/project
              rm -rf .git
              npm test
              npm run build
            '
  browser:
    name: Chromium (${{ matrix.suite }}) ${{ matrix.actor }}
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: browser}
          - {suite: finance-browser}
          - {suite: improvements-browser}
          - {suite: documents-browser}
          - {suite: p0-browser}
          - {suite: daily-leave-browser}
          - {suite: clinics-browser}
          - {suite: stock-browser}
          - {suite: tables-browser}
          - {suite: consolidation-browser}
          - {suite: profile-audit-browser, actor: u1}
          - {suite: profile-audit-browser, actor: test_admin}
          - {suite: profile-audit-browser, actor: test_adm}
          - {suite: profile-audit-browser, actor: test_med}
          - {suite: profile-audit-browser, actor: test_tec}
          - {suite: profile-audit-browser, actor: test_call}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare browser image (no application execution)
        run: docker build -t gs-visual-tests -f tests/ci/Dockerfile tests/ci
      - name: Execute synthetic tests in a container with no network
        env:
          SUITE: ${{ matrix.suite }}
          GS_AUDIT_ACTOR: ${{ matrix.actor }}
        run: |
          mkdir -p "$RUNNER_TEMP/gs-artifacts"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --shm-size=1g \
            --tmpfs /tmp:rw,exec,size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$RUNNER_TEMP/gs-artifacts",target=/artifacts \
            --user "$(id -u):$(id -g)" \
            -e GS_AUDIT_ACTOR="$GS_AUDIT_ACTOR" \
            --workdir /source gs-visual-tests python tests/ci/run-browser.py "$SUITE"
      - name: Upload synthetic screenshots, traces and effective result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chromium-${{ matrix.suite }}-${{ matrix.actor || 'shared' }}-${{ github.sha }}
          path: ${{ runner.temp }}/gs-artifacts
          if-no-files-found: error
          retention-days: 30

  preserve-baseline:
    if: github.ref == 'refs/heads/fix/v4-p0-security-hardening-clinics-stock'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: required
        run: |
          if [ -f tests/visual/baseline/4a58d5e/manifest.json ]; then
            echo "capture=false" >> "$GITHUB_OUTPUT"
          else
            echo "capture=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Retrieve approved synthetic screenshots and traces
        if: steps.required.outputs.capture == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38293004119
          path: docs/evidence/4a58d5e
      - name: Checkout immutable approved source
        if: steps.required.outputs.capture == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4a58d5eb06090900ca12be4a9856c6e4a69a972a
          path: approved-source
          persist-credentials: false
      - name: Capture desktop, tablet, mobile and both themes without network
        if: steps.required.outputs.capture == 'true'
        run: |
          docker build -t gs-visual-tests -f tests/ci/Dockerfile tests/ci
          mkdir -p tests/visual/baseline/4a58d5e
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --shm-size=1g --tmpfs /tmp:rw,exec,size=1g \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$GITHUB_WORKSPACE/approved-source",target=/source,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/tests/visual",target=/harness,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/tests/visual/baseline/4a58d5e",target=/artifacts \
            -e GS_VISUAL_SHA=4a58d5eb06090900ca12be4a9856c6e4a69a972a \
            gs-visual-tests python /harness/capture.py
      - name: Preserve baseline and original evidence in the development branch
        if: steps.required.outputs.capture == 'true'
        env:
          GH_EVIDENCE_TOKEN: ${{ github.token }}
        run: python3 tests/visual/publish-evidence.py

  server-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare PostgreSQL/Node test image
        run: docker build -t gs-postgres-tests -f tests/ci/Dockerfile.postgres tests/ci
      - name: Real SQL, HTTP, authorization and concurrency without external network
        run: |
          mkdir -p "$RUNNER_TEMP/gs-api-audit"
          chmod 777 "$RUNNER_TEMP/gs-api-audit"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,exec,size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$RUNNER_TEMP/gs-api-audit",target=/artifacts \
            -e GS_TEST_ARTIFACTS=/artifacts -e GS_TEST_DISPOSABLE_POSTGRES=true --workdir /source \
            gs-postgres-tests node tests/modules-postgres.cjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-api-matrix-${{ github.sha }}
          path: ${{ runner.temp }}/gs-api-audit
          if-no-files-found: error
          retention-days: 30

  visual-pixels:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0e2f7996b6c658e3dff2f878202bcce3bca299a9
          path: approved-pixel-source
          persist-credentials: false
      - name: Build pinned visual environment
        run: docker build -t gs-visual-tests -f tests/ci/Dockerfile tests/ci
      - name: Capture six profiles, three viewports and both themes; compare unchanged pixels
        run: |
          mkdir -p "$RUNNER_TEMP/gs-pixels"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --shm-size=1g --tmpfs /tmp:rw,exec,size=1g \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/approved-pixel-source",target=/reference-source,readonly \
            --mount type=bind,source="$RUNNER_TEMP/gs-pixels",target=/artifacts \
            -e GS_VISUAL_SCOPED_FIXTURES=true -e GS_PIXEL_BASE=/tmp/reference \
            -e GS_VISUAL_SHA="${{ github.sha }}" gs-visual-tests \
            sh -ec 'GS_VISUAL_SOURCE=/reference-source GS_VISUAL_OUTPUT=/tmp/reference GS_VISUAL_SHA=0e2f7996b6c658e3dff2f878202bcce3bca299a9 python /source/tests/visual/capture.py; cp -R /tmp/reference /artifacts/reference-scoped-0e2f799; GS_VISUAL_FULLPAGE=true python /source/tests/visual/capture.py; GS_REFERENCE_GEOMETRY=/tmp/reference/manifest.json python /source/tests/visual/compare.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-pixels-${{ github.sha }}
          path: ${{ runner.temp }}/gs-pixels
          if-no-files-found: error
          retention-days: 30

  central-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare browser, Node and local PostgreSQL image
        run: docker build -t gs-central-tests -f tests/ci/Dockerfile.central tests/ci
      - name: Browser to verified cookie to API to disposable SQL, without external network
        run: |
          mkdir -p "$RUNNER_TEMP/gs-central"
          chmod 777 "$RUNNER_TEMP/gs-central"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --shm-size=1g --tmpfs /tmp:rw,exec,size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$RUNNER_TEMP/gs-central",target=/artifacts \
            -e GS_TEST_DISPOSABLE_POSTGRES=true -e GS_TEST_ARTIFACTS=/artifacts \
            --workdir /source gs-central-tests python tests/central-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: central-integration-${{ github.sha }}
          path: ${{ runner.temp }}/gs-central
          retention-days: 30
          if-no-files-found: error

  profile-matrix:
    needs: browser
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chromium-profile-audit-browser-*
          path: matrix-input
      - name: Consolidate effective results of all six profiles
        run: |
          python3 - <<'MATRIX'
          import json,csv
          from pathlib import Path
          rows=[]
          for p in Path('matrix-input').rglob('matrix-ui.json'): rows.extend(json.loads(p.read_text()))
          assert len({r['profile'] for r in rows})==6
          assert not any(r['state']=='Falhou' for r in rows)
          out=Path('profile-matrix');out.mkdir()
          (out/'matrix-ui.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          with (out/'matrix-ui.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          print(json.dumps({'profiles':6,'executions':len(rows),'failed':0}))
          MATRIX
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-validation-matrix-${{ github.sha }}
          path: profile-matrix
          retention-days: 30

  preview-package:
    needs: [regression, browser, server-postgresql, visual-pixels, profile-matrix, central-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package tested static synthetic preview without APIs or credentials
        run: |
          mkdir -p "$RUNNER_TEMP/gs-preview"
          docker pull node:24-bookworm-slim
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,exec,size=1g \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GS_PREVIEW_COMMIT="${{ github.sha }}" \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$RUNNER_TEMP/gs-preview",target=/artifacts \
            node:24-bookworm-slim sh -ec 'cp -R /source /tmp/project; cd /tmp/project; node scripts/build-static.cjs; node tests/ci/package-preview.cjs /artifacts'
          python3 - <<'PREVIEWZIP'
          import os,shutil
          shutil.make_archive(os.environ['RUNNER_TEMP']+'/gs-preview/preview-static','zip',os.environ['RUNNER_TEMP']+'/gs-preview/preview-static')
          PREVIEWZIP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-preview-${{ github.sha }}
          path: ${{ runner.temp }}/gs-preview
          if-no-files-found: error
          retention-days: 30
