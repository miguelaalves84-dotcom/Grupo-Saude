name: V4 preview regression
on:
  pull_request:
permissions:
  contents: read
  checks: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
  browser:
    name: browser (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, finance-browser, improvements-browser, documents-browser]
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/gs-http.log 2>&1 &
      - run: python tests/${{ matrix.suite }}.py
        env:
          GS_TEST_URL: http://127.0.0.1:8765/index.html
      - run: python tests/resolve-preview.py
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GS_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python tests/${{ matrix.suite }}.py
        env:
          GS_TEST_URL: ${{ env.GS_PREVIEW_TEST_URL }}
